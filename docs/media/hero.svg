<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title description">
  <title id="title">同一款 ChatGPT Plus 个人月订阅的两家店铺报价</title>
  <desc id="description">两张系在一起的价签分别写着示例店乙 76 元、示例店甲 90 元。店铺和价格均来自项目的虚构演示。</desc>
  <rect x="1" y="1" width="1078" height="458" rx="14" fill="#F6F3E9" stroke="#B8C4B5" stroke-width="2"/>
  <g font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <text x="52" y="98" font-size="78" font-weight="650" letter-spacing="-3" fill="#163E35">ChatGPT Plus</text>
    <text x="55" y="153" font-size="35" font-weight="500" fill="#3F5B50">个人订阅 · 1 个月</text>
    <text x="1025" y="95" text-anchor="end" font-size="34" font-weight="600" fill="#456458">虚构报价示例</text>

    <!-- The facing tag holes tie both shop prices to the same subscription. -->
    <path d="M66 193H423L503 269V336L423 412H66Q52 412 52 398V207Q52 193 66 193Z" fill="#154C3D"/>
    <path d="M657 193H1014Q1028 193 1028 207V398Q1028 412 1014 412H657L577 336V269Z" fill="#D9E8CE" stroke="#73947A" stroke-width="2"/>
    <circle cx="462" cy="302" r="12" fill="#F6F3E9"/>
    <circle cx="618" cy="302" r="12" fill="#F6F3E9" stroke="#73947A" stroke-width="2"/>
    <path d="M462 303C499 257 541 238 566 253C608 280 548 359 523 344C499 329 554 271 618 302" fill="none" stroke="#9A663D" stroke-width="5" stroke-linecap="round"/>

    <text x="92" y="251" font-size="34" font-weight="550" fill="#E0EDD9">示例店乙</text>
    <g fill="#FFFFF1">
      <text x="89" y="367" font-size="57" font-weight="500">¥</text>
      <text x="134" y="369" font-size="122" letter-spacing="-6" font-weight="650">76</text>
    </g>
    <text x="681" y="251" font-size="34" font-weight="550" fill="#385344">示例店甲</text>
    <g fill="#173D30">
      <text x="678" y="367" font-size="57" font-weight="500">¥</text>
      <text x="723" y="369" font-size="122" letter-spacing="-6" font-weight="650">90</text>
    </g>
  </g>
</svg>
