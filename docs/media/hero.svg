<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title description">
  <title id="title">链动小铺跨店比价</title>
  <desc id="description">本地候选库收录 535 个店铺入口。2026 年 11 月 18 日定向采集了 143 家店的目标分类，其中 42 家店出现可归入 ChatGPT Plus、Pro 或 Team 的商品。</desc>
  <rect x="1" y="1" width="1078" height="458" rx="14" fill="#F6F3E9" stroke="#B8C4B5" stroke-width="2"/>
  <g font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <text x="52" y="93" font-size="70" font-weight="700" fill="#163E35">链动小铺跨店比价</text>
    <g font-size="33" font-weight="550" fill="#456458">
      <text x="55" y="153">ChatGPT Plus / Pro / Team</text>
      <text x="1027" y="153" text-anchor="end">2026-11-18 定向采集</text>
    </g>
    <rect x="49" y="189" width="982" height="226" rx="12" fill="#154C3D"/>
    <path d="M378 214V390 M704 214V390" stroke="#628574" stroke-width="2"/>
    <g fill="#D6E9D1" font-size="33" font-weight="600">
      <text x="82" y="254">候选店铺库</text><text x="408" y="254">当轮读取的店铺</text><text x="734" y="254">识别出套餐的店</text>
    </g>
    <g fill="#FFFFF1" font-weight="650">
      <text x="79" y="352" font-size="94">535<tspan dx="9" font-size="38">个入口</tspan></text>
      <text x="405" y="352" font-size="94">143<tspan dx="9" font-size="38">家</tspan></text>
      <text x="731" y="352" font-size="94">42<tspan dx="9" font-size="38">家</tspan></text>
    </g>
    <g fill="#AECF9B">
      <rect x="82" y="378" width="248" height="9" rx="4"/>
      <rect x="408" y="378" width="66" height="9" rx="4"/>
      <rect x="734" y="378" width="19" height="9" rx="4"/>
    </g>
  </g>
</svg>
