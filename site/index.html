<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' https://qn.ldxp.cn https://www.ldxp.cn https://wzyp.cn; base-uri 'none'; form-action 'none'">
  <title>链动小铺 AI 订阅比价</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#quotes">跳到报价</a>
  <main>
    <header>
      <div class="heading">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <h1>链动小铺 AI 订阅比价</h1>
      </div>
      <div class="update">
        <span id="notice" class="notice" role="status" hidden></span>
        <span class="checked-time" hidden><time id="checked-at"></time> 核验（北京时间）</span>
      </div>
    </header>
    <form id="filters" role="search" aria-label="筛选报价">
      <div class="plan-toolbar">
        <label class="brand-field"><span class="field-label">品牌</span>
          <select id="brand">
            <option value="chatgpt">ChatGPT</option>
            <option value="">全部品牌</option>
          </select>
        </label>
        <fieldset class="plans"><legend>套餐</legend><div id="plans" role="group" aria-label="套餐筛选"></div></fieldset>
      </div>
      <div class="search-toolbar">
        <label class="search"><span class="field-label">搜索</span>
          <input type="search" id="query" placeholder="搜商品或店铺" maxlength="150" autocomplete="off">
        </label>
        <label class="sort-field"><span class="field-label">排序</span>
          <select id="sort">
            <option value="price_asc">组内低价优先</option>
            <option value="price_desc">组内高价优先</option>
            <option value="recent">最近核验优先</option>
          </select>
        </label>
        <details id="more-filters" class="more-filters">
          <summary>筛选<span id="filter-count" class="filter-count" hidden></span></summary>
          <div class="filter-panel">
            <p class="filter-help">不同规格分别排序。商品详情里可以核对期限、起购量和核验时间。</p>
            <label>库存
              <select id="stock">
                <option value="recent">近两小时核验有货</option>
                <option value="observed">核验时有货</option>
                <option value="all">全部库存状态</option>
              </select>
            </label>
            <label>本轮变化
              <select id="change">
                <option value="">全部报价</option>
                <option value="restocked">本轮补货</option>
                <option value="price_drop">同规格降价</option>
                <option value="first_seen">首次发现</option>
              </select>
            </label>
            <button id="reset-advanced" type="button" hidden>重置这两项</button>
          </div>
        </details>
      </div>
    </form>
    <noscript><p>请开启 JavaScript 以读取和筛选报价。</p></noscript>
    <section id="quotes" aria-labelledby="results-title">
      <div class="result-header">
        <div class="result-heading">
          <h2 id="results-title">全部报价</h2>
          <p id="result-count" aria-live="polite">正在读取报价…</p>
        </div>
        <button id="other-team" type="button" hidden></button>
        <div class="quote-actions">
          <button id="copy-link" type="button" aria-label="复制当前筛选链接" hidden>复制链接</button>
        </div>
      </div>
      <div id="share-result" class="share-result" hidden>
        <p id="share-status" role="status"></p>
        <input id="share-url" type="url" readonly hidden aria-label="长按复制当前筛选网址">
      </div>
      <div class="column-head" aria-hidden="true"><span>商品 / 店铺</span><span>原店标价 / 库存</span></div>
      <div id="rows"></div>
      <p id="empty" class="empty" hidden></p>
      <nav id="pages" aria-label="报价分页" hidden>
        <button id="previous" type="button">上一页</button>
        <span id="page-number"></span>
        <button id="next" type="button">下一页</button>
      </nav>
    </section>
    <footer><span id="coverage"></span></footer>
  </main>
</body>
</html>
